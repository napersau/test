server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # nginx không kế thừa add_header từ cấp server vào location có add_header riêng, nên header bảo mật đặt trong snippet và include ở từng nơi.
  # Tệp build có hash trong tên nên cache lâu; index.html không cache để bản mới có hiệu lực ngay.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
