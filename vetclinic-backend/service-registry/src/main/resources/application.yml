server:
  port: 8761

spring:
  application:
    name: service-registry

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # Môi trường demo ít instance: tắt self-preservation để instance chết được gỡ nhanh
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000
    # Mặc định Eureka trả danh sách từ cache chỉ đọc làm mới mỗi 30s -> service mới đăng ký phải chờ
    # tới 30s mới được Gateway nhìn thấy (request đầu tiên báo "No servers available")
    use-read-only-response-cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
