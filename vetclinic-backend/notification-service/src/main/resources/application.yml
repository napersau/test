server:
  port: 8085

spring:
  application:
    name: notification-service
  autoconfigure:
    # Xác thực do Gateway đảm nhận; tắt user/password mặc định mà Boot tự sinh
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:vetclinic}
    password: ${RABBITMQ_PASSWORD:vetclinic_dev}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

vetclinic:
  security:
    public-paths:
      - /ws/**                      # JWT được kiểm tra trong STOMP CONNECT (StompAuthChannelInterceptor), không phải ở HTTP
  websocket:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    jwt-secret: ${JWT_SECRET}       # cùng khóa với auth-service và Gateway, tối thiểu 32 byte
    mail-from: ${MAIL_FROM:no-reply@vetclinic.local}
    history-size: 50                # số thông báo gần nhất giữ trong bộ nhớ cho mỗi người dùng / vai trò
    zone: Asia/Ho_Chi_Minh          # múi giờ hiển thị trong email

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Không có SMTP khi demo thì health vẫn UP; lỗi gửi mail chỉ log, không làm service bị coi là chết
    mail:
      enabled: false
